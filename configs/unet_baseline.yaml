# configs/unet_baseline.yaml
#
# This is the main configuration file for our first baseline experiment.
# It defines all parameters for the data, model, and training process.

# --- General ---
experiment_name: "unet_baseline"
results_dir: "./results/unet_baseline" # Where to save models and logs
device: "cuda"  # 'cuda' or 'cpu'

# --- Model Configuration ---
model:
  name: "baseline_unet"

# --- Data Configuration ---
data:
  data_dir: "./data/imagecas"
  val_split: 0.2
  patch_size: [96, 96, 96]
  preprocess:
    vesselness: false  # baseline_unet uses 1 input channel (CT only)

# --- Training Configuration ---
training:
  learning_rate: 1e-4
  weight_decay: 1e-4
  warmup_epochs: 5
  samples_per_volume: 4  # random patches cropped per volume (DataLoader batch_size=1)
  num_epochs: 100