# configs/att_mamba2_unet.yaml
#
# This experiment runs the Hybrid Attention-Mamba2 U-Net.

# --- General ---
experiment_name: "att_mamba2_unet_baseline"
results_dir: "./results/att_mamba2_unet_baseline"
device: "cuda"

# --- Model Configuration ---
model:
  name: "att_mamba2_unet"
  features: [32, 64, 128, 256]  # encoder channel progression across 4 stages
  in_channels: 2  # CT intensity + Frangi vesselness (appended during preprocessing)

# --- Data Configuration ---
data:
  data_dir: "./data/imagecas"
  val_split: 0.2
  patch_size: [96, 96, 96]

# --- Training Configuration ---
training:
  learning_rate: 1e-4
  weight_decay: 1e-4
  warmup_epochs: 5
  samples_per_volume: 4  # random patches cropped per volume (DataLoader batch_size=1)
  num_epochs: 100
