[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "coronary-segmentation"
version = "1.0.0"
description = "3D coronary artery segmentation from CTA volumes"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
